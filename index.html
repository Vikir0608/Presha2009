<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      overflow:hidden;
      background:linear-gradient(52deg,#1e1628,#371437,#411414,#0c3b3b);
      background-size: cover;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      color:white;
    }

    .background-stars{
      position:absolute;
      width:100%;
      height:100%;
      overflow:hidden;
      z-index:0;
    }

    .star{
      position:absolute;
      width:4px;
      height:4px;
      background:rgb(157, 211, 8);
      border-radius:50%;
      animation: twinkle 3s infinite alternate;
    }

    @keyframes twinkle{
      from{opacity:0.2;}
      to{opacity:1;}
    }

    .container{
      position:relative;
      z-index:4;
      width:90%;
      max-width:800px;
      padding:40px;
      border-radius:30px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(0px);
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
      text-align:center;
      overflow:hidden;
      animation: zoomIn 2s ease;
    }

    @keyframes zoomIn{
      from{
        transform:scale(0.5);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    h1{
      font-size:4rem;
      margin-bottom:15px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow{
      from{
        text-shadow:0 0 10px #ff00ff;
      }
      to{
        text-shadow:
        0 0 20px #ff00ff,
        0 0 40px #ff66ff,
        0 0 60px #ff99ff;
      }
    }

    .name{
      color:#ffd700;
    }

    p{
      font-size:1.2rem;
      margin-top:10px;
      line-height:1.8;
      opacity:0.9;
    }

    .btn-group{
      margin-top:30px;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:15px;
    }

    button{
      padding:15px 28px;
      border:none;
      border-radius:50px;
      font-size:1rem;
      cursor:pointer;
      transition:0.4s;
      font-weight:600;
      color:white;
      position:relative;
      overflow:hidden;
    }

    .surprise{
      background:linear-gradient(45deg,#ff00dd,#0400ff);
    }

    .music{
      background:linear-gradient(45deg,#1013be,#f80808);
    }

    .confetti-btn{
      background:linear-gradient(45deg,#04ddec,#f70707);
      color:black;
    }

    button:hover{
      transform:translateY(-5px) scale(1.05);
      box-shadow:0 10px 25px rgba(255,255,255,0.3);
    }

    .balloon{
      position:absolute;
      bottom:-150px;
      width:140px;
      animation: floatUp linear infinite;
      z-index:1;
    }

    @keyframes floatUp{
      from{
        transform:translateY(0) rotate(0deg);
      }
      to{
        transform:translateY(-120vh) rotate(45deg);
      }
    }

    .cake{
      width: 400px;
      margin:20px auto;
      animation:bounce 2s infinite;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-15px);
      }
    }

    .message{
      margin-top:25px;
      font-size:1.3rem;
      color:#ffeb3b;
      min-height:40px;
      font-weight:600;
    }

    .confetti{
      position:absolute;
      width:10px;
      height:10px;
      top:-20px;
      animation:fall linear forwards;
    }

    @keyframes fall{
      to{
        transform:translateY(110vh) rotate(720deg);
      }
    }

    .typing{
      font-size:1.3rem;
      border-right:3px solid rgb(255, 0, 0);
      white-space: nowrap;
      overflow:hidden;
      width:0;
      animation:typing 5s steps(40,end) forwards,
      blink 0.8s infinite;
      margin:auto;
      text-align: center;
    }

    @keyframes typing{
      to{
        width:100%;
      }
    }

    @keyframes blink{
      50%{
        border-color:transparent;
      }
    }

    @media(max-width:768px){
      h1{
        font-size:2.5rem;
      }

      p{
        font-size:1rem;
      }

      .container{
        padding:25px;
      }

      .cake{
        width:130px;
      }
    }
  </style>
</head>

<body>

  <div class="background-stars" id="stars"></div>

  <img src="images/1.jpeg" class="balloon" style="left:2%; top:50%; width:300px; animation-duration:10s;">
  <img src="images/2.jpeg" class="balloon" style="left:10%; top:70%; width:300px; animation-duration:12s;">
  <img src="images/3.jpeg" class="balloon" style="left:30%; top:30%; width:300px; animation-duration:8s;">
  <img src="images/4.jpeg" class="balloon" style="left:50%; top:40%; width:300px; animation-duration:13s;">
  <img src="images/5.jpeg" class="balloon" style="left:70%; top:90%; width:300px; animation-duration:9s;">
  <img src="images/6.jpeg" class="balloon" style="left:90%; top:100%; width:300px; animation-duration:7s;">
  <img src="images/7.jpeg" class="balloon" style="left:65%; top:30%; width:300px; animation-duration:11s;">
  <img src="images/8.jpeg" class="balloon" style="left:20%; top:20%; width:300px; animation-duration:17s;">
  <img src="images/9.jpeg" class="balloon" style="left:40%; top:80%; width:300px; animation-duration:19s;">
  <img src="images/10.jpeg" class="balloon" style="left:60%; top:60%; width:300px; animation-duration:18s;">
  <img src="images/11.jpeg" class="balloon" style="left:85%; top:85%; width:300px; animation-duration:15s;">
  <img src="images/12.jpeg" class="balloon" style="left:95%; top:90%; width:300px; animation-duration:14s;">
  <img src="images/13.jpeg" class="balloon" style="left:75%; top:10%; width:300px; animation-duration:16s;">
  <img src="images/14.jpeg" class="balloon" style="left:35%; top:5%; width:300px; animation-duration:12s;">
  <img src="images/15.jpeg" class="balloon" style="left:40%; top:70%; width:300px; animation-duration:14s;">
  <img src="images/16.jpeg" class="balloon" style="left:30%; top:80%; width:300px; animation-duration:9s;">
  <img src="images/17.jpeg" class="balloon" style="left:45%; top:90%; width:300px; animation-duration:16s;">
  <img src="images/18.jpeg" class="balloon" style="left:20%; top:1005%; width:300px; animation-duration:11s;">
  <img src="images/19.jpeg" class="balloon" style="left:10%; top:100%; width:300px; animation-duration:10s;">

  <div class="container">

    <h1>🎉 Happy Birthday <span class="name"> Preshu </span> 🎂</h1>

    <img class="cake" src="images/19.jpeg">
    <p class="typing">
      Wish you Many Many Happy Returns of the Day Presha!!!🎂🎂<br>
    </p>

    <div class="message" id="message"></div>

    <div class="btn-group">
      <button class="surprise" onclick="showMessage()">🎁 Surprise</button>
      <button class="confetti-btn" onclick="createConfetti()">✨ Celebration</button>
      <button class="music" onclick="playMusic()">🎵 Voice Note</button>
    </div>

  </div>

  <audio id="birthdaySong">
    <source src="music/HBL.mp3" type="audio/mpeg">  
  </audio>

  <script>

    // Create stars
    const stars = document.getElementById("stars");

    for(let i=0; i<120; i++){
      let star = document.createElement("div");
      star.classList.add("star");

      star.style.left = Math.random()*100 + "%";
      star.style.top = Math.random()*100 + "%";

      star.style.animationDuration = (Math.random()*3 + 2) + "s";

      stars.appendChild(star);
    }

    // Surprise Messages
    const messages = [
      "🎂 May all your dreams come true! 🌃",
      "💖 You deserve all the happiness in the world! 🌍",
      "🎁 Enjoy your beautiful journey ahead!",
      "✨ Keep smiling and shining always! 🌞",
      "🥳 Have an unforgettable birthday celebration! 🥳🎆",
      "🎉 Today is all about 🫵 !",
      "🎈 Make a wish and blow out the candles! 🕯️",
      "🌟 Wishing you a year filled with love and laughter! 🤗",
      "🍰 May your birthday be as sweet as you are! 🍰",
      "🎊 Cheers to another year of amazing adventures! 🎉",
      "💌 Sending you warm birthday wishes and hugs! 💌",
    ];

    function showMessage(){
      const random = Math.floor(Math.random()*messages.length);
      document.getElementById("message").innerHTML = messages[random];

      createConfetti();
    }

    // Confetti Animation
    function createConfetti(){

      for(let i=0; i<120; i++){

        const confetti = document.createElement("div");
        confetti.classList.add("confetti");

        confetti.style.left = Math.random()*100 + "vw";
        confetti.style.background =
          `hsl(${Math.random()*360},100%,50%)`;

        confetti.style.width =
          confetti.style.height =
          Math.random()*10 + 5 + "px";

        confetti.style.animationDuration =
          Math.random()*3 + 2 + "s";

        document.body.appendChild(confetti);

        setTimeout(()=>{
          confetti.remove();
        },5000);
      }
    }

    // Music
    function playMusic(){
      const music = document.getElementById("birthdaySong");
      music.play();
    }

    // Auto Confetti on Load
    window.onload = () => {
      createConfetti();
    }

  </script>

</body>
</html>
